let current = 0;
let correctCount = 0;
let answered = false;

function renderQuestion() {
  const q = questions[current];
  if (!q) return;
  let html = `<div class="question">Câu ${q.id}: ${q.q}</div><div class="options">`;
  q.a.forEach((opt, idx) => {
    const letter = String.fromCharCode(65 + idx);
    html += `<label><input type="radio" name="q" value="${idx}"> ${letter}. ${opt}</label>`;
  });
  html += `</div>`;
  document.getElementById('questionArea').innerHTML = html;
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('scoreDisplay').innerHTML = `Điểm: ${correctCount}/${current}`;
  document.getElementById('progress').innerHTML = `Câu ${current+1}/${questions.length}`;
  answered = false;
  // Bỏ chọn radio cũ
  const radios = document.querySelectorAll('input[name="q"]');
  radios.forEach(r => r.checked = false);
}

function checkAnswer() {
  if (answered) return;
  const radios = document.querySelectorAll('input[name="q"]');
  let selected = -1;
  radios.forEach((r, idx) => { if (r.checked) selected = idx; });
  if (selected === -1) { alert('Vui lòng chọn đáp án.'); return; }
  const q = questions[current];
  const isCorrect = (selected === q.c);
  if (isCorrect) correctCount++;
  let feedback = isCorrect ? 'Đúng!' : `Sai. Đáp án đúng là ${String.fromCharCode(65 + q.c)}.`;
  document.getElementById('feedback').innerHTML = feedback;
  document.getElementById('feedback').className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  document.getElementById('scoreDisplay').innerHTML = `Điểm: ${correctCount}/${current+1}`;
  answered = true;
}

function nextQuestion() {
  if (!answered) { alert('Vui lòng kiểm tra câu hiện tại.'); return; }
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    document.getElementById('questionArea').innerHTML = '<h3>Hoàn thành tất cả câu hỏi!</h3>';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('progress').innerHTML = `Kết thúc. Điểm: ${correctCount}/${questions.length}`;
  }
}

function resetQuiz() {
  current = 0;
  correctCount = 0;
  answered = false;
  renderQuestion();
}

// Khởi tạo
renderQuestion();
</script>
