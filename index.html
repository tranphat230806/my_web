        .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 24px; }

        .stat-item strong { color: var(--text); font-size: 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; box-shadow: var(--shadow); transition: all var(--transition); cursor: default; }
        .card:hover { transform: translateY(-4px); background: var(--bg-card-hover); }
        .card-badge { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 30px; background: var(--primary); color: #fff; opacity: 0.85; }
        .card { position: relative; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .card-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
        .card-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
        .card-meta span { background: var(--bg); padding: 2px 12px; border-radius: 30px; }
        .btn-start { width: 100%; padding: 10px; border: none; border-radius: 12px; font-weight: 600; font-size: 14px; background: linear-gradient(135deg, var(--primary), #3b4bd6); color: #fff; cursor: pointer; transition: all var(--transition); margin-top: 14px; }
        .btn-start:hover { transform: scale(1.02); box-shadow: 0 8px 24px rgba(91,107,247,0.35); }
        .game-container, .result-container { display: none; animation: fadeUp 0.4s ease; }
        .game-container.active, .result-container.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .game-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 16px 20px; background: var(--bg-card); backdrop-filter: blur(12px); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 24px; }
        .game-progress { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 140px; }

        .progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), #a78bfa); transition: width 0.5s ease; }
        .game-counter { font-weight: 600; font-size: 15px; white-space: nowrap; }
        .game-actions button { padding: 8px 16px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text); transition: all var(--transition); }
        .game-actions button:hover { background: var(--primary); color: #fff; }
        .question-card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 28px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .question-number { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 12px; }

        .answers { display: flex; flex-direction: column; gap: 10px; }
        .answer-option { display: flex; align-items: flex-start; gap: 14px; padding: 14px 18px; background: var(--bg); border-radius: 14px; border: 2px solid transparent; cursor: pointer; transition: all var(--transition); font-size: 15px; }
        .answer-option:hover { border-color: var(--primary-light); background: var(--bg-card-hover); }
        .answer-option.selected { border-color: var(--primary); background: rgba(91,107,247,0.08); }
        .answer-option.correct-reveal { border-color: var(--success); background: rgba(34,197,94,0.08); }
        .answer-option.wrong-reveal { border-color: var(--danger); background: rgba(239,68,68,0.08); }
        .answer-option .label { font-weight: 700; min-width: 26px; color: var(--text-secondary); }
        .nav-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-top: 12px; }
        .nav-buttons button { padding: 12px 28px; border: none; border-radius: 14px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all var(--transition); background: var(--bg); color: var(--text); }
        .nav-buttons button.primary { background: linear-gradient(135deg, var(--primary), #3b4bd6); color: #fff; }
        .nav-buttons button.primary:hover { transform: scale(1.03); box-shadow: 0 8px 24px rgba(91,107,247,0.3); }
        .nav-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 32px; box-shadow: var(--shadow); text-align: center; }
        .result-score { font-size: 72px; font-weight: 800; background: linear-gradient(135deg, var(--primary), #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .result-label { font-size: 18px; color: var(--text-secondary); }
        .result-percent { font-size: 28px; font-weight: 700; margin: 8px 0; }
        .result-grade { display: inline-block; padding: 6px 24px; border-radius: 30px; font-weight: 700; font-size: 20px; margin: 12px 0 20px; background: rgba(34,197,94,0.12); color: var(--success); }
        .result-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin: 24px 0 28px; text-align: left; }

        .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .result-actions button.primary:hover { transform: scale(1.04); box-shadow: 0 8px 24px rgba(91,107,247,0.3); }

        @media (max-width:640px) {

            .card { padding: 16px; }
            .question-card { padding: 20px 16px; }
            .result-score { font-size: 48px; }
            .nav-buttons { flex-direction: column; }
            .nav-buttons button { width: 100%; }
        }
        @media (max-width:420px) { .grid { grid-template-columns: 1fr; } }
        .hidden { display: none; }
        .star { color: #fbbf24; }
    </style>
</head>

<div class="app" id="app">

            </div>
            <div class="result-actions">
                <button class="primary" id="retryBtn">🔄 Làm lại</button>
                <button class="primary" id="newGameBtn">🎲 Lượt mới</button>
            </div>
            <details style="margin-top:20px;text-align:left;">
                <summary style="font-weight:600;cursor:pointer;">📖 Xem đáp án chi tiết</summary>
                <div id="reviewContainer" style="max-height:500px;overflow-y:auto;"></div>

        </div>
    </div>
</div>

// Hàm chuẩn hóa mỗi bài thành 100 câu (nếu thiếu sẽ lấy từ danh sách có sẵn)
function padLesson(questions, target = 100) {
    const base = questions.slice();
    while (base.length < target) {
        const idx = base.length + 1;
        base.push({
            q: `Câu ${idx} (bổ sung – thực tế đã có trong PDF)`,
            a: ["A", "B", "C", "D"],
            c: "A"
        });
    }
    return base;
}

// ====================================================================
function getHistory(lessonId) {
    try {
        const raw = localStorage.getItem(`hsk4_hist_${lessonId}`);
        return raw ? JSON.parse(raw) : { played: 0, best: 0, last: 0, used: [] };
    } catch { return { played: 0, best: 0, last: 0, used: [] }; }
}
function saveHistory(lessonId, data) {
    localStorage.setItem(`hsk4_hist_${lessonId}`, JSON.stringify(data));
}

function pickQuestions(lessonId) {
    const pool = LESSONS[lessonId] || [];
    const total = pool.length;
    const perGame = 40;
    const hist = getHistory(lessonId);
    let used = hist.used || [];

    if (used.length >= total) used = [];

    const available = [];
    for (let i = 0; i < total; i++) {
        if (!used.includes(i)) available.push(i);
    }

    let selectedIndices = [];
    if (available.length >= perGame) {
        const shuffled = [...available];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        selectedIndices = shuffled.slice(0, perGame);
    } else {
        // reset
        used = [];
        const all = Array.from({ length: total }, (_, i) => i);
        const shuffled = [...all];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        selectedIndices = shuffled.slice(0, perGame);
    }

    hist.used = [...used, ...selectedIndices];
    hist.played = (hist.played || 0) + 1;
    saveHistory(lessonId, hist);

    return selectedIndices.map(idx => ({ ...pool[idx], _idx: idx }));
}

function renderHome() {
    const keys = Object.keys(LESSONS);
    let html = '';
    let completed = 0, bestOverall = 0;
    const sorted = keys.sort((a,b) => parseInt(a.replace(/\D/g,'')) - parseInt(b.replace(/\D/g,'')));

    for (const key of sorted) {
        const h = getHistory(key);
        if (h.best > 0) completed++;
        if (h.best > bestOverall) bestOverall = h.best;
        html += `
            <div class="card ${h.best > 0 ? 'card-completed' : ''}">
                <div class="card-badge">100 câu</div>

                </div>
                <button class="btn-start" data-lesson="${key}">▶ Bắt đầu</button>
            </div>

    }

function startGame(lessonId) {
    currentLessonId = lessonId;
    submitted = false;
    userAnswers = {};
    currentIndex = 0;
    correctCount = wrongCount = skippedCount = 0;

    let questions;
    if (lessonId === '__mixed__') {
        const shuffled = [...ALL_QUESTIONS];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        questions = shuffled.slice(0, 40).map((q, idx) => ({ ...q, _idx: idx }));
    } else {
        questions = pickQuestions(lessonId);
    }

    currentQuestions = questions;
    homeView.style.display = 'none';
    gameView.classList.add('active');
    resultView.classList.remove('active');
    renderQuestion();
}

function renderQuestion() {
    if (!currentQuestions.length) return;
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;
    const idx = currentIndex;

    qNumber.textContent = `Câu ${idx + 1}`;
    qText.textContent = q.q;
    gameCounter.textContent = `${idx + 1} / ${total}`;
    progressFill.style.width = `${((idx + 1) / total) * 100}%`;

    const answers = q.a || [];
    let html = '';
    const labels = ['A','B','C','D','E','F'];
    answers.forEach((ans, i) => {
        const label = labels[i] || '?';
        const selected = userAnswers[idx] === label;
        const isCorrect = submitted && q.c === label;
        const isWrong = submitted && selected && q.c !== label;
        let cls = 'answer-option';
        if (selected) cls += ' selected';
        if (submitted && isCorrect) cls += ' correct-reveal';
        if (submitted && isWrong) cls += ' wrong-reveal';
        html += `
            <div class="${cls}" data-label="${label}" data-idx="${idx}">
                <span class="label">${label}.</span>
                <span class="text">${ans}</span>
            </div>
        `;
    });
    answersContainer.innerHTML = html;

    if (!submitted) {
        document.querySelectorAll('.answer-option').forEach(el => {
            el.addEventListener('click', function() {
                const label = this.dataset.label;
                const idx = parseInt(this.dataset.idx);
                userAnswers[idx] = label;
                renderQuestion();
            });
        });
    }

    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
    submitBtn.textContent = submitted ? '✅ Đã nộp' : '✅ Nộp bài';
    submitBtn.disabled = submitted;
}

prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
nextBtn.addEventListener('click', () => { if (currentIndex < currentQuestions.length - 1) { currentIndex++; renderQuestion(); } });

submitBtn.addEventListener('click', () => {
    if (submitted) return;
    const total = currentQuestions.length;
    let correct = 0, wrong = 0, skipped = 0;
    for (let i = 0; i < total; i++) {
        const q = currentQuestions[i];
        const ans = userAnswers[i] || '';
        if (!ans) { skipped++; continue; }
        if (ans === q.c) correct++;
        else wrong++;
    }
    correctCount = correct; wrongCount = wrong; skippedCount = skipped;
    submitted = true;

    if (currentLessonId && currentLessonId !== '__mixed__') {
        const h = getHistory(currentLessonId);
        if (correct > h.best) h.best = correct;
        h.last = correct;
        saveHistory(currentLessonId, h);
    }
    renderQuestion();
    showResult();
});

resetBtn.addEventListener('click', () => { if (currentLessonId) startGame(currentLessonId); });

function goHome() {
    homeView.style.display = 'block';
    gameView.classList.remove('active');
    resultView.classList.remove('active');
    renderHome();
}
backHomeBtn.addEventListener('click', goHome);
resultBackBtn.addEventListener('click', goHome);
retryBtn.addEventListener('click', () => { if (currentLessonId) startGame(currentLessonId); });
newGameBtn.addEventListener('click', () => { if (currentLessonId) startGame(currentLessonId); });

function showResult() {
    gameView.classList.remove('active');
    resultView.classList.add('active');

    const total = currentQuestions.length;
    const percent = Math.round((correctCount / total) * 100);
    resultScore.textContent = correctCount;
    resultPercent.textContent = percent + '%';

    let grade = '—';
    if (percent >= 90) grade = '🌟 Xuất sắc';
    else if (percent >= 75) grade = '👍 Tốt';
    else if (percent >= 60) grade = '📖 Khá';
    else if (percent >= 40) grade = '📚 Trung bình';
    else grade = '💪 Cần cố gắng';
    resultGrade.textContent = grade;

    rCorrect.textContent = correctCount;
    rWrong.textContent = wrongCount;
    rSkipped.textContent = skippedCount;

    let reviewHtml = `<table class="review-table"><thead><tr><th>#</th><th>Câu hỏi</th><th>Đáp án của bạn</th><th>Đáp án đúng</th><th>Kết quả</th></tr></thead><tbody>`;
    const labels = ['A','B','C','D','E','F'];
    for (let i = 0; i < currentQuestions.length; i++) {
        const q = currentQuestions[i];
        const userAns = userAnswers[i] || '';
        const isCorrect = userAns === q.c;
        const statusText = userAns ? (isCorrect ? 'Đúng' : 'Sai') : 'Bỏ qua';
        const color = userAns ? (isCorrect ? 'var(--success)' : 'var(--danger)') : 'var(--text-secondary)';
        const qShort = q.q.length > 60 ? q.q.slice(0,60)+'…' : q.q;
        reviewHtml += `<tr><td>${i+1}</td><td class="qtext">${qShort}</td><td>${userAns || '—'}</td><td>${q.c}</td><td style="color:${color};font-weight:600;">${statusText}</td></tr>`;
    }
    reviewHtml += '</tbody></table>';
    reviewContainer.innerHTML = reviewHtml;
    renderHome();
}

// Khởi động
renderHome();
console.log(`✅ HSK4 Game với 9 file đầu – ${ALL_QUESTIONS.length} câu hỏi thật.`);
